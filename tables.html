<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px double red;
        }
        th,td{
            border: 1px solid black;
            color: white;
            font-size: 30px;
        }
        th{
            background-color: rgb(4, 208, 208);
        }
        td{
            background-color: tomato;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="4">ROWSPAN</th>
            <th colspan="2">COLSPAN</th>
        </tr>
        <tr>
            <th>ID</th>
            <th>NAME</th>
        </tr>
        <tr>
            <td>101</td>
            <td>AMIT</td>
        </tr>
        <tr>
            <td>102</td>
            <td>PIYUSH</td>
        </tr>
    </table>
</body>
</html>
